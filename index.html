<style>
/* Layout: yksi kapea sarake pelipöydän vihreällä huovalla. Saldo on suurin asia, kolikon kullalla. */
:root{
  color-scheme:dark;
  --bg:#0f1f14; --card:#1a3324; --card2:#142a1d; --ink:#f5f0e8; --muted:#9db3a3; --line:#2f5a40;

}

[hidden]{display:none!important}
body{
  background:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(201,168,76,.05) 39px,rgba(201,168,76,.05) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(201,168,76,.05) 39px,rgba(201,168,76,.05) 40px);

  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 48px; min-height:100%;
}

.chip{font:inherit;font-size:.78rem;color:var(--gold);background:rgba(201,168,76,.1);border:1px solid var(--line);border-radius:3px;padding:6px 10px;min-height:34px;cursor:pointer}
.log{display:flex;flex-direction:column;max-height:240px;overflow-y:auto}

.log div:first-child{border-top:0}
.log b{font-weight:500;color:var(--gold);white-space:nowrap}
details.sheet summary{cursor:pointer;font-weight:500;color:var(--gold);min-height:32px;display:flex;align-items:center}

.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tbox{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:28px 24px;text-align:center;width:min(22rem,100%);display:flex;flex-direction:column;gap:10px;align-items:center}
.tbox.bust{border-color:var(--red)}
.tbox .th{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--gold)}
.tbox.bust .th{color:var(--red)}
.tbox .ta{font-family:var(--display);font-weight:900;font-size:2.6rem;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.tbox p{color:var(--muted)}
.tbox .btn{width:100%;margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .tbox{animation:pop .25s ease-out both}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
}
</style>

<div class="topbar" id="topbar" hidden><button class="fsbtn" id="fsbtn" type="button"></button></div>
<div class="wrap" id="app"></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
'use strict';

// Sivun julkinen osoite QR-koodia varten. Jätä tyhjäksi, niin käytetään sivun omaa osoitetta.
var BASE = '';

var MAXP = 8, MAXV = 1000000000;
var $app = document.getElementById('app'), $toasts = document.getElementById('toasts');
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var rand = function(n){ return Math.floor(Math.random()*n); };
var rid = function(n){ var a='abcdefghijklmnopqrstuvwxyz0123456789', s=''; for(var i=0;i<n;i++) s+=a.charAt(rand(a.length)); return s; };
var money = function(n){ var neg=n<0; var s=String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (neg?'−':'')+s+' €'; };
var num = function(v){ v=+v; return (isFinite(v)&&v>0) ? Math.min(Math.floor(v),MAXV) : 0; };
var PID = /^p[a-z0-9]{4}$/;
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }

var room = null, roomChecked = false;
var G = null;            // käynnissä oleva peli
var cur = '', homeMsg = '', rcache = {};
var ui = {to:null, overS:false, overD:false, leave:false};
var toastQ = [], toastOn = false, toastTimer = null, uiTimer = null;

/* ---------- verkkoyhteys: julkinen MQTT-välittäjä (ei kirjautumista, ei tilejä) ----------
   Tarjoaa saman rajapinnan kuin aiempi "room": peers(), presence(), onPeers(). */
var BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
var NS = 'monopolin-pankkiiri-v1';
var PEER_TTL = 20000, BEAT = 5000;
function connectRoom(){
  return new Promise(function(resolve){
    if(typeof mqtt==='undefined'){ resolve(null); return; }
    var idx = 0;
    function tryNext(){
      if(idx>=BROKERS.length){ resolve(null); return; }
      var url = BROKERS[idx++], done = false, c;
      try{ c = mqtt.connect(url, {clientId:'pk-'+rid(10), clean:true, reconnectPeriod:2000, connectTimeout:5000, keepalive:30}); }
      catch(e){ tryNext(); return; }
      var to = setTimeout(function(){ if(!done){ done = true; try{ c.end(true); }catch(e){} tryNext(); } }, 6000);
      c.on('error', function(){});
      c.on('connect', function(){
        if(done){ return; }
        done = true; clearTimeout(to);
        resolve(makeRoom(c));
      });
    }
    tryNext();
  });
}
function makeRoom(c){
  var me = rid(10), mine = {}, others = {}, cbs = [], lastKey = {};
  var topic = function(g){ return NS+'/g/'+g+'/'+me; };
  function fire(){ cbs.forEach(function(f){ try{ f(); }catch(e){} }); }
  function send(replyWanted){
    if(!mine.g) return;
    var o = {}; Object.keys(mine).forEach(function(k){ o[k] = mine[k]; });
    if(replyWanted) o.h = 1;
    try{ c.publish(topic(mine.g), JSON.stringify(o), {qos:0, retain:false}); }catch(e){}
  }
  c.subscribe(NS+'/g/+/+', {qos:0});
  c.on('connect', function(){ c.subscribe(NS+'/g/+/+', {qos:0}); send(true); });
  c.on('message', function(t, payload){
    var p = String(t).split('/'); var id = p[p.length-1];
    if(id===me) return;
    var pr; try{ pr = JSON.parse(payload.toString()); }catch(e){ return; }
    if(!pr || typeof pr!=='object') return;
    if(pr.gone){ if(others[id]){ delete others[id]; fire(); } return; }
    var h = pr.h; delete pr.h;
    var key = JSON.stringify(pr), prev = others[id];
    others[id] = {presence:pr, seen:Date.now()};
    if(!prev || lastKey[id]!==key){ lastKey[id] = key; fire(); }
    if(h && mine.g){ setTimeout(function(){ send(false); }, 50+rand(300)); }
  });
  setInterval(function(){
    var now = Date.now(), ch = false;
    Object.keys(others).forEach(function(id){ if(now-others[id].seen>PEER_TTL){ delete others[id]; delete lastKey[id]; ch = true; } });
    send(false);
    if(ch) fire();
  }, BEAT);
  function bye(){
    if(mine.g){ try{ c.publish(topic(mine.g), JSON.stringify({gone:1}), {qos:0}); }catch(e){} }
  }
  window.addEventListener('pagehide', bye);
  return {
    peers: function(){
      var now = Date.now(), out = [];
      out.push({kind:'viewer', isMe:true, presence:mine});
      Object.keys(others).forEach(function(id){
        if(now-others[id].seen<=PEER_TTL) out.push({kind:'viewer', isMe:false, presence:others[id].presence});
      });
      return out;
    },
    presence: function(obj){
      var oldG = mine.g;
      Object.keys(obj).forEach(function(k){ if(obj[k]===null||obj[k]===undefined) delete mine[k]; else mine[k] = obj[k]; });
      if(oldG && oldG!==mine.g){ try{ c.publish(NS+'/g/'+oldG+'/'+me, JSON.stringify({gone:1}), {qos:0}); }catch(e){} }
      send(mine.g && mine.g!==oldG);
      return Promise.resolve();
    },
    onPeers: function(cb){ cbs.push(cb); }
  };
}

function hashCode(){ var m = /^#(\d{3})$/.exec(location.hash||''); return m ? m[1] : ''; }
function newCode(){ return String(100+rand(900)); }
function joinUrl(c){ return (BASE || String(location.href).split('#')[0]) + '#' + c; }
function qrSvg(text){
  try{ if(typeof qrcode!=='function') return ''; var q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }
  catch(e){ return ''; }
}

/* ---------- pelin tila: jokaisella pelaajalla oma kirjanpito (vain kasvavia laskureita) ----------
   saldo = alkusaldo + nostot - pankille maksetut + saadut - lähetetyt.
   Jokainen puhelin kertoo omat laskurinsa läsnäolotietona ja välittää myös muiden tiedot eteenpäin,
   joten tilanne säilyy vaikka joku sulkee sivun tai viestejä katoaa. */
function newEnt(n){ return {n:String(n).slice(0,14), j:Math.floor(Date.now()/1000), s:{}, w:0, d:0, x:0}; }
function bal(pid){
  var e = G.L[pid]; if(!e) return 0;
  var b = G.st + e.w - e.d, y, k;
  for(y in G.L){ if(G.L[y].s[pid]) b += G.L[y].s[pid]; }
  for(k in e.s) b -= e.s[k];
  return b;
}
function isBust(pid){ var e = G.L[pid]; return !!(e && e.x); }
function shown(pid){ return isBust(pid) ? 0 : bal(pid); }
function plist(){ return Object.keys(G.L).sort(function(a,b){ return (G.L[a].j-G.L[b].j) || (a<b?-1:1); }); }
function gamePeers(){
  if(!room || !G) return [];
  return room.peers().filter(function(p){ return p.kind==='viewer' && p.presence && p.presence.g===G.code; });
}
function presentSet(){ var s={}; gamePeers().forEach(function(p){ if(p.presence.pid) s[p.presence.pid]=1; }); return s; }
function winner(){
  var ids = plist(); if(!G.ph || ids.length<2) return null;
  var act = ids.filter(function(p){ return !isBust(p); });
  return act.length===1 ? act[0] : null;
}

function mergeL(src){
  var ch = false, notify = !!(G.pid && G.syncAt && Date.now()>=G.syncAt);
  Object.keys(src).forEach(function(pid){
    if(!PID.test(pid)) return;
    var s = src[pid]; if(!s || typeof s!=='object') return;
    var e = G.L[pid];
    if(!e){
      if(Object.keys(G.L).length>=MAXP) return;
      e = G.L[pid] = {n:String(s.n||'Pelaaja').slice(0,14), j:num(s.j), s:{}, w:0, d:0, x:0}; ch = true;
    }
    var mine = (pid===G.pid);
    var w = num(s.w); if(w>e.w){ if(notify && !mine) toast('bank', e.n, w-e.w); e.w=w; ch=true; }
    var d = num(s.d); if(d>e.d){ e.d=d; ch=true; }
    if(s.x && !e.x){ e.x=1; ch=true; if(notify && !mine) toast('bust', e.n, 0); }
    if(s.s && typeof s.s==='object') Object.keys(s.s).forEach(function(to){
      if(!PID.test(to)) return;
      var v = num(s.s[to]), old = e.s[to]||0;
      if(v>old){ e.s[to]=v; ch=true; if(notify && !mine && to===G.pid) toast('got', e.n, v-old); }
    });
  });
  return ch;
}
function mergeLog(arr){
  var ch = false;
  arr.slice(0,20).forEach(function(x){
    if(!x || typeof x!=='object') return;
    var i = String(x.i||'').slice(0,24); if(!i || G.lg[i]) return;
    if(['p','w','d','x','s'].indexOf(x.k)<0) return;
    G.lg[i] = {i:i, t:num(x.t), k:x.k, f:String(x.f||'').slice(0,5), o:String(x.o||'').slice(0,5), a:num(x.a)}; ch = true;
  });
  var ks = Object.keys(G.lg);
  if(ks.length>60){ ks.sort(function(a,b){ return G.lg[a].t-G.lg[b].t; }).slice(0,ks.length-60).forEach(function(k){ delete G.lg[k]; }); }
  return ch;
}
function addLog(o){
  o.i = G.pid + Date.now().toString(36) + rid(2); o.t = Math.floor(Date.now()/1000);
  G.lg[o.i] = o;
}
function packL(){
  var out = {};
  Object.keys(G.L).forEach(function(pid){
    var e = G.L[pid], o = {n:e.n, j:e.j};
    if(e.w) o.w = e.w; if(e.d) o.d = e.d; if(e.x) o.x = 1;
    var ks = Object.keys(e.s);
    if(ks.length){ o.s = {}; ks.forEach(function(k){ o.s[k] = e.s[k]; }); }
    out[pid] = o;
  });
  return out;
}
function packLog(n){ return Object.keys(G.lg).map(function(k){ return G.lg[k]; }).sort(function(a,b){ return b.t-a.t; }).slice(0,n); }
function publish(){
  if(!room || !G || !G.pid) return;
  var pr = {g:G.code, pid:G.pid, n:G.L[G.pid].n, gid:G.gid, st:G.st, ph:G.ph?1:0, L:packL(), lg:packLog(10)};
  if(JSON.stringify(pr).length>3600) pr.lg = packLog(3);
  if(JSON.stringify(pr).length>3800) pr.lg = [];
  room.presence(pr).catch(function(){});
  saveCache();
}
function saveCache(){
  if(!G || !G.pid) return;
  store('pankkiiri-'+G.code, JSON.stringify({pid:G.pid, gid:G.gid, L:packL(), lg:packLog(30), ph:G.ph?1:0, st:G.st, ts:Date.now()}));
  store('pankkiiri-active', JSON.stringify({code:G.code, name:G.L[G.pid].n, ts:Date.now()}));
}
function loadCache(c){
  try{ var o = JSON.parse(store('pankkiiri-'+c)||'null'); if(o && o.pid && o.L && Date.now()-o.ts<12*3600*1000) return o; }catch(e){}
  return null;
}
function activeGame(){
  try{ var a = JSON.parse(store('pankkiiri-active')||'null'); if(a && /^\d{3}$/.test(a.code) && Date.now()-a.ts<12*3600*1000 && loadCache(a.code)) return a; }catch(e){}
  return null;
}

/* ---------- ilmoitukset ---------- */
function toast(kind, name, amt){
  var t = kind==='got' ? {h:'Sait rahaa', a:money(amt), m:name+' lähetti sinulle rahaa'}
        : kind==='bank' ? {h:'Pankkinosto', a:money(amt), m:name+' nosti pankista'}
        : {h:'Konkurssi', a:'', m:name+' meni konkurssiin'};
  t.k = kind; toastQ.push(t);
  if(!toastOn) nextToast();
}
function nextToast(){
  clearTimeout(toastTimer);
  var t = toastQ.shift();
  if(!t){ toastOn = false; $toasts.innerHTML = ''; return; }
  toastOn = true;
  try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
  $toasts.innerHTML = '<div class="ov" role="alertdialog" aria-live="assertive"><div class="tbox '+(t.k==='bust'?'bust':'')+'"><div class="th">'+esc(t.h)+'</div>'+
    (t.a?'<div class="ta">'+esc(t.a)+'</div>':'')+'<p>'+esc(t.m)+'</p><button class="btn gold" type="button" data-toast="ok">OK</button></div></div>';
  toastTimer = setTimeout(nextToast, 8000);
}
$toasts.addEventListener('click', function(e){ if(e.target.closest('[data-toast]')) nextToast(); });

/* ---------- liittyminen ---------- */
function afterJoin(){ keepAwake(); }
function finalize(pid){
  G.pid = pid; G.syncAt = Date.now()+1500;
  afterJoin(); publish(); update();
}
function tryFinalize(){
  if(!G || G.pid) return;
  var ps = gamePeers().filter(function(p){ return !p.isMe && p.presence.L && p.presence.gid; });
  var age = Date.now()-G.t0;
  if(!ps.length){
    if(G.cache && age>1500){ finalize(G.cache.pid); return; }
    if(age>7000) leaveGame('Peliä ei löytynyt koodilla '+G.code+'.');
    return;
  }
  var gid = ps[0].presence.gid;
  if(G.gid && G.gid!==gid){ G.gid=null; G.L={}; G.lg={}; G.ph=0; G.stSet=false; G.cache=null; ps.forEach(function(p){ mergeL(p.presence.L); }); }
  G.gid = gid;
  if(G.cache && G.cache.gid===G.gid && G.L[G.cache.pid]){ finalize(G.cache.pid); return; }
  var lname = G.name.toLowerCase(), hit = null, pids = Object.keys(G.L);
  pids.forEach(function(p){ if(G.L[p].n.toLowerCase()===lname) hit = p; });
  var present = presentSet();
  if(hit){
    if(present[hit] && G.pid!==hit){ leaveGame('Nimi '+G.name+' on jo käytössä tässä pelissä.'); return; }
    finalize(hit); return;
  }
  if(pids.length>=MAXP){ leaveGame('Peli on täynnä ('+MAXP+' pelaajaa).'); return; }
  var pid; do{ pid = 'p'+rid(4); }while(G.L[pid]);
  G.L[pid] = newEnt(G.name); finalize(pid);
}
function createGame(){
  if(!room) return;
  var n = readName('cname'); if(!n) return;
  var st = parseInt(document.getElementById('cst').value,10);
  if(!(st>=100 && st<=100000)){ inlineMsg('Aloitussaldo on 100–100 000 €.'); return; }
  var used = {}; room.peers().forEach(function(p){ if(p.presence && p.presence.g) used[p.presence.g]=1; });
  var c, t = 0; do{ c = newCode(); t++; }while(used[c] && t<40);
  var pid = 'p'+rid(4);
  G = {code:c, name:n, gid:'g'+rid(5), pid:pid, st:st, stSet:true, ph:0, L:{}, lg:{}, t0:Date.now(), syncAt:Date.now()+1500, cache:null};
  G.L[pid] = newEnt(n);
  homeMsg = ''; ui.to = null; afterJoin(); publish(); update();
}
function joinGame(c, n){
  if(!room) return;
  var ca = loadCache(c);
  G = {code:c, name:n, pid:null, gid:null, st:1500, stSet:false, ph:0, L:{}, lg:{}, t0:Date.now(), syncAt:0, cache:ca};
  if(ca){ G.gid = ca.gid; G.st = ca.st; G.stSet = true; G.ph = ca.ph?1:0; mergeL(ca.L); mergeLog(ca.lg||[]); }
  room.presence({g:c, n:n}).catch(function(){});
  homeMsg = ''; ui.to = null; update(); onChange();
}
function joinFromForm(){
  if(!room) return;
  var n = readName('jname'); if(!n) return;
  var c = (document.getElementById('code').value||'').trim();
  if(!/^\d{3}$/.test(c)){ inlineMsg('Koodissa on 3 numeroa.'); return; }
  joinGame(c, n);
}
function leaveGame(msg){
  if(G){ store('pankkiiri-'+G.code, null); }
  store('pankkiiri-active', null);
  if(room) room.presence({g:null, pid:null, n:null, gid:null, st:null, ph:null, L:null, lg:null}).catch(function(){});
  G = null; ui = {to:null, overS:false, overD:false, leave:false};
  toastQ = []; nextToast();
  homeMsg = msg||''; showHome();
}

/* ---------- toiminnot ---------- */
function readName(id){
  var el = document.getElementById(id), n = el ? el.value.trim().slice(0,14) : '';
  if(!n){ if(el) el.focus(); inlineMsg('Kirjoita ensin nimesi.'); return ''; }
  store('pankkiiri-name', n); return n;
}
function inlineMsg(t){ var el = document.getElementById('net'); if(el){ el.textContent = t; el.className = 'net bad'; } }
function readAmt(id){ var el = document.getElementById(id), v = el ? parseInt(el.value,10) : 0; return (v>0 && v<=1000000) ? v : 0; }
function arm(key){ ui[key] = true; clearTimeout(uiTimer); uiTimer = setTimeout(function(){ ui.overS = ui.overD = ui.leave = false; if(G&&G.pid) syncControls(); }, 4000); }
function disarm(){ ui.overS = ui.overD = false; }
function settle(){
  var me = G.pid, e = G.L[me];
  if(bal(me)<0 && !e.x){ e.x = 1; addLog({k:'x', f:me}); }
}
function say(id, t){ var el = document.getElementById(id); if(el){ el.textContent = t; clearTimeout(say[id]); say[id] = setTimeout(function(){ el.textContent=''; }, 2800); } }
function doSend(){
  var me = G.pid, to = ui.to;
  if(isBust(me) || !to || !G.L[to] || isBust(to)) return;
  var a = readAmt('amt'); if(!a) return;
  if(a>bal(me) && !ui.overS){ arm('overS'); syncControls(); return; }
  var e = G.L[me]; e.s[to] = (e.s[to]||0)+a;
  addLog({k:'p', f:me, o:to, a:a});
  settle(); disarm();
  document.getElementById('amt').value = '';
  say('smsg', 'Lähetit '+money(a)+' pelaajalle '+G.L[to].n+'.');
  publish(); update();
}
function doWithdraw(){
  var me = G.pid; if(isBust(me)) return;
  var a = readAmt('bamt'); if(!a) return;
  G.L[me].w += a; addLog({k:'w', f:me, a:a});
  document.getElementById('bamt').value = ''; disarm();
  say('bmsg', 'Nostit '+money(a)+' pankista.');
  publish(); update();
}
function doDeposit(){
  var me = G.pid; if(isBust(me)) return;
  var a = readAmt('bamt'); if(!a) return;
  if(a>bal(me) && !ui.overD){ arm('overD'); syncControls(); return; }
  G.L[me].d += a; addLog({k:'d', f:me, a:a});
  settle(); disarm();
  document.getElementById('bamt').value = '';
  say('bmsg', 'Maksoit '+money(a)+' pankille.');
  publish(); update();
}
function startGame(){
  if(!G || !G.pid || G.ph || plist().length<2) return;
  G.ph = 1; addLog({k:'s'}); publish(); update();
}

/* ---------- näkymät ---------- */
function setHtml(id, html){
  var el = document.getElementById(id); if(!el) return;
  if(rcache[id]===html) return;
  rcache[id] = html; el.innerHTML = html;
}
function showHome(){
  cur = 'home'; rcache = {};
  var saved = store('pankkiiri-name') || '';
  var pre = hashCode(), act = activeGame();
  var nameIn = function(id){ return '<input type="text" id="'+id+'" maxlength="14" autocomplete="nickname" value="'+esc(saved)+'">'; };
  var createInner =
    '<h2>Luo uusi peli</h2>'+
    '<p class="hint">Saat pelikoodin ja QR-koodin, jolla muut liittyvät. Kaikki aloittavat samalla saldolla.</p>'+
    '<div><label for="cname">Nimesi</label>'+nameIn('cname')+'</div>'+
    '<div><label for="cst">Aloitussaldo (€)</label><input type="number" id="cst" inputmode="numeric" value="1500" min="100" max="100000"></div>'+
    '<button class="btn gold" type="button" data-act="create" id="bcreate">Luo peli</button>';
  var joinCard =
    '<div class="sheet"><h2>'+(pre?'Liity peliin '+esc(pre):'Liity peliin')+'</h2>'+
    '<p class="hint">'+(pre?'Koodi on jo täytetty. Kirjoita nimesi ja liity.':'Kirjoita koodi tai skannaa QR-koodi toisen pelaajan puhelimesta.')+'</p>'+
    '<div><label for="jname">Nimesi</label>'+nameIn('jname')+'</div>'+
    '<div><label for="code">Pelikoodi</label><input type="text" id="code" maxlength="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" value="'+esc(pre)+'"></div>'+
    '<button class="btn'+(pre?' gold':'')+'" type="button" data-act="join" id="bjoin">Liity peliin</button></div>';
  var resume = act ? '<div class="sheet"><h2>Peli '+esc(act.code)+' on kesken</h2><p class="hint">Olit mukana nimellä '+esc(act.name)+'. Saldosi säilyy.</p><button class="btn gold" type="button" data-act="resume" id="bresume">Palaa peliin</button></div>' : '';
  $app.innerHTML =
    '<div><p class="tab">Pankki · 2–8 pelaajaa</p><h1 class="word">Monopolin Pankkiiri</h1></div>'+
    (pre||act?'':'<p class="lede">Jokainen pelaa omalla puhelimellaan. Raha liikkuu pelaajien ja pankin välillä, ja saldot päivittyvät kaikille heti.</p>')+
    (homeMsg?'<p class="note">'+esc(homeMsg)+'</p>':'')+
    resume+
    (pre ? joinCard+'<details class="sheet"><summary>Luo sen sijaan oma peli</summary>'+createInner+'</details>'
         : '<div class="sheet">'+createInner+'</div>'+joinCard)+
    '<p class="net" id="net"></p>';
  updateNet();
}
function updateNet(){
  var el = document.getElementById('net'); if(!el) return;
  ['bcreate','bjoin','bresume'].forEach(function(id){ var b = document.getElementById(id); if(b) b.disabled = (!room && roomChecked); });
  if(!roomChecked){ el.textContent = 'Yhdistetään…'; el.className = 'net'; }
  else if(!room){ el.textContent = 'Yhteyttä ei saatu. Tarkista internetyhteys ja lataa sivu uudelleen.'; el.className = 'net bad'; }
  else if(el.className==='net'){ el.textContent = ''; }
}
function inviteHtml(){
  var svg = qrSvg(joinUrl(G.code));
  return '<p class="hint">Muut skannaavat QR-koodin tai kirjoittavat koodin sivun alussa.</p>'+
    '<h1 class="word codebig" aria-label="Pelikoodi">'+esc(G.code)+'</h1>'+
    (svg?'<div class="qr" aria-label="QR-koodi pelin liittymiseen">'+svg+'</div>':'');
}
function build(key){
  cur = key; rcache = {};
  if(key==='wait'){
    $app.innerHTML = '<div class="sheet"><h2>Haetaan peliä '+esc(G.code)+'</h2><p class="hint">Tämä kestää hetken.</p></div><button class="btn ghost" type="button" data-act="leave">Peruuta</button>';
  } else if(key==='lobby'){
    $app.innerHTML =
      '<div><p class="tab">Pelihuone</p><h1 class="word">Odotushuone</h1></div>'+
      '<div class="sheet">'+inviteHtml()+'</div>'+
      '<div class="sheet"><h2 id="lobby-h">Pelaajat</h2><ul class="pl" id="lobby-pl"></ul></div>'+
      '<div class="sheet"><p class="hint">Alkusaldo '+esc(money(G.st))+'. Kuka tahansa pelaajista voi aloittaa pelin.</p>'+
      '<button class="btn gold" type="button" data-act="start" id="bstart">Aloita peli</button><p class="hint" id="lobby-hint"></p></div>'+
      '<button class="btn ghost" type="button" data-act="leave" id="bleave">Poistu</button>';
  } else {
    $app.innerHTML =
      '<div id="win"></div>'+
      '<div class="me-box"><div class="me-name" id="me-name"></div><div class="me-bal" id="me-bal"></div><div id="me-stamp"></div></div>'+
      '<div class="sheet"><h2>Lähetä rahaa pelaajalle</h2>'+
        '<div class="rc" id="rc"></div>'+
        '<div class="chips"><button class="chip" type="button" data-q="50">50</button><button class="chip" type="button" data-q="100">100</button><button class="chip" type="button" data-q="200">200</button><button class="chip" type="button" data-q="500">500</button></div>'+
        '<div><label for="amt">Summa (€)</label><input type="number" id="amt" inputmode="numeric" min="1" placeholder="Summa"></div>'+
        '<button class="btn gold" type="button" data-act="send" id="bsend">Valitse vastaanottaja</button><div class="ok" id="smsg"></div></div>'+
      '<div class="sheet"><h2>Pankki</h2>'+
        '<div class="chips"><button class="chip" type="button" data-bq="50">50</button><button class="chip" type="button" data-bq="100">100</button><button class="chip" type="button" data-bq="200">200</button></div>'+
        '<div><label for="bamt">Summa (€)</label><input type="number" id="bamt" inputmode="numeric" min="1" placeholder="Summa"></div>'+
        '<div class="row"><button class="btn gold" type="button" data-act="withdraw" id="bwd">Nosta pankista</button><button class="btn" type="button" data-act="deposit" id="bdp">Maksa pankille</button></div><div class="ok" id="bmsg"></div></div>'+
      '<div class="sheet"><h2>Tapahtumat</h2><div class="log" id="log"></div></div>'+
      '<details class="sheet"><summary>Kutsu pelaajia</summary>'+inviteHtml()+'</details>'+
      '<button class="btn ghost" type="button" data-act="leave" id="bleave">Poistu pelistä</button>';
  }
}
function update(){
  if(!G){ if(cur!=='home') showHome(); else updateNet(); return; }
  var key = !G.pid ? 'wait' : (G.ph ? 'game' : 'lobby');
  if(key!==cur) build(key);
  if(key==='lobby') fillLobby(); else if(key==='game') fillGame();
}
function fillLobby(){
  var ids = plist(), pres = presentSet();
  document.getElementById('lobby-h').textContent = 'Pelaajat ('+ids.length+')';
  setHtml('lobby-pl', ids.map(function(p){
    return '<li><span class="pn"><span class="dot'+(pres[p]?'':' off')+'"></span>'+esc(G.L[p].n)+(p===G.pid?'<span class="badge">sinä</span>':'')+'</span></li>';
  }).join(''));
  var b = document.getElementById('bstart'); if(b) b.disabled = ids.length<2;
  var h = document.getElementById('lobby-hint'); if(h) h.textContent = ids.length<2 ? 'Tarvitaan vähintään 2 pelaajaa.' : '';
  var l = document.getElementById('bleave'); if(l){ l.textContent = ui.leave ? 'Varmista: poistu' : 'Poistu'; }
}
var LOGT = {
  p: function(x){ return [nm(x.f)+' → '+nm(x.o), money(x.a)]; },
  w: function(x){ return [nm(x.f)+' nosti pankista', '+'+money(x.a)]; },
  d: function(x){ return [nm(x.f)+' maksoi pankille', '−'+money(x.a)]; },
  x: function(x){ return [nm(x.f)+' meni konkurssiin', '']; },
  s: function(){ return ['Peli alkoi', '']; }
};
function nm(pid){ return G.L[pid] ? G.L[pid].n : 'Pelaaja'; }
function fillGame(){
  var me = G.pid, bust = isBust(me), ids = plist(), pres = presentSet();
  var w = winner();
  setHtml('win', w ? '<div class="win">'+esc(nm(w))+' voitti pelin</div>' : '');
  document.getElementById('me-name').textContent = nm(me);
  var b = shown(me), el = document.getElementById('me-bal');
  el.textContent = money(b); el.className = 'me-bal'+((bust||b<200)?' low':'');
  setHtml('me-stamp', bust ? '<span class="stamp">Konkurssi</span>' : '');
  var others = ids.filter(function(p){ return p!==me; });
  if(ui.to && (!G.L[ui.to] || isBust(ui.to))) ui.to = null;
  if(!ui.to){ var open = others.filter(function(p){ return !isBust(p); }); if(open.length===1) ui.to = open[0]; }
  setHtml('rc', others.length ? others.map(function(p){
    var bp = isBust(p);
    return '<button class="rcp'+(ui.to===p?' sel':'')+'" type="button" data-to="'+p+'"'+(bp||bust?' disabled':'')+'><b><span class="dot'+(pres[p]?'':' off')+'"></span>'+esc(G.L[p].n)+'</b><span>'+(bp?'konkurssi':esc(money(shown(p))))+'</span></button>';
  }).join('') : '<p class="hint">Ei muita pelaajia. Kutsu heidät alta.</p>');
  var ents = Object.keys(G.lg).map(function(k){ return G.lg[k]; }).sort(function(a,b){ return b.t-a.t; }).slice(0,30);
  setHtml('log', ents.length ? ents.map(function(x){
    var r = (LOGT[x.k]||LOGT.s)(x);
    var t = new Date(x.t*1000).toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    return '<div><span>'+esc(t)+' · '+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';
  }).join('') : '<p class="hint">Ei tapahtumia vielä.</p>');
  var l = document.getElementById('bleave'); if(l) l.textContent = ui.leave ? 'Varmista: poistu pelistä' : 'Poistu pelistä';
  syncControls();
}
function syncControls(){
  if(cur!=='game' || !G || !G.pid) return;
  var me = G.pid, bust = isBust(me), my = bal(me);
  var a = readAmt('amt'), ba = readAmt('bamt');
  var s = document.getElementById('bsend');
  var amt = document.getElementById('amt'), bamt = document.getElementById('bamt');
  amt.disabled = bust; bamt.disabled = bust;
  s.className = 'btn gold'; s.disabled = true;
  if(bust){ s.textContent = 'Olet konkurssissa'; }
  else if(!ui.to){ s.textContent = 'Valitse vastaanottaja'; }
  else if(!a){ s.textContent = 'Syötä summa'; }
  else if(a>my){
    s.disabled = false; s.className = 'btn red'+(ui.overS?' armed':'');
    s.textContent = ui.overS ? 'Varmista: maksa ja mene konkurssiin' : 'Saldo ei riitä. Maksa silti';
  } else { s.disabled = false; s.textContent = 'Lähetä '+money(a)+' → '+nm(ui.to); }
  var wd = document.getElementById('bwd'), dp = document.getElementById('bdp');
  wd.disabled = bust || !ba; dp.disabled = bust || !ba;
  dp.className = (!bust && ba>my) ? 'btn red'+(ui.overD?' armed':'') : 'btn';
  dp.textContent = (!bust && ba>my) ? (ui.overD ? 'Varmista: maksa ja mene konkurssiin' : 'Saldo ei riitä. Maksa silti') : 'Maksa pankille';
}

/* ---------- huoneen muutokset ---------- */
function onChange(){
  if(!G){ if(cur==='home') updateNet(); return; }
  var ch = false;
  gamePeers().forEach(function(p){
    var pr = p.presence;
    if(typeof pr.ph==='number' && pr.ph>0 && !G.ph){ G.ph = 1; ch = true; }
    if(!G.stSet && typeof pr.st==='number' && pr.st>=100 && pr.st<=100000){ G.st = pr.st; G.stSet = true; ch = true; }
    if(pr.L && typeof pr.L==='object') ch = mergeL(pr.L) || ch;
    if(Array.isArray(pr.lg)) ch = mergeLog(pr.lg) || ch;
  });
  tryFinalize();
  if(!G) return;
  if(G.pid && ch) publish();
  update();
}

/* ---------- tapahtumat ---------- */
$app.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-to]'))){ ui.to = t.getAttribute('data-to'); disarm(); fillGame(); return; }
  if((t = e.target.closest('[data-q]'))){ document.getElementById('amt').value = t.getAttribute('data-q'); disarm(); syncControls(); return; }
  if((t = e.target.closest('[data-bq]'))){ document.getElementById('bamt').value = t.getAttribute('data-bq'); disarm(); syncControls(); return; }
  t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.getAttribute('data-act');
  if(act==='create') createGame();
  else if(act==='join') joinFromForm();
  else if(act==='resume'){ var a = activeGame(); if(a) joinGame(a.code, a.name); }
  else if(act==='start') startGame();
  else if(act==='send' && G && G.pid) doSend();
  else if(act==='withdraw' && G && G.pid) doWithdraw();
  else if(act==='deposit' && G && G.pid) doDeposit();
  else if(act==='leave'){
    if(!G || !G.pid || ui.leave){ leaveGame(''); }
    else { arm('leave'); update(); }
  }
});
$app.addEventListener('input', function(e){
  if(e.target.id==='code') e.target.value = e.target.value.replace(/\D/g,'').slice(0,3);
  if(e.target.id==='amt' || e.target.id==='bamt'){ disarm(); syncControls(); }
});
window.addEventListener('hashchange', function(){ if(!G){ var c = hashCode(), el = document.getElementById('code'); if(el && c) el.value = c; } });
setInterval(function(){ if(G && !G.pid) tryFinalize(); }, 500);

/* ---------- näyttö pysyy päällä ---------- */
var wl = null;
function keepAwake(){
  try{
    if(navigator.wakeLock && G && G.pid && !wl){
      navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release', function(){ wl = null; }); }).catch(function(){});
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') keepAwake(); });

/* ---------- käynnistys ---------- */
showHome();
(async function(){
  try{ room = await connectRoom(); }catch(e){ room = null; }
  roomChecked = true;
  if(room){
    room.onPeers(onChange);
  }
  if(!G) updateNet();
})();
})();

/* ---------- koko näytön tila ---------- */
(function(){
  var de = document.documentElement, bt = document.getElementById('fsbtn'), bar = document.getElementById('topbar');
  var can = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(de.requestFullscreen || de.webkitRequestFullscreen);
  if(!bt || !can) return;
  var IN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg>';
  var OUT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 1v5H1M15 6h-5V1M10 15v-5h5M1 10h5v5"/></svg>';
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function upd(){ bt.innerHTML = (isFs()?OUT:IN)+'<span>'+(isFs()?'Poistu koko näytöstä':'Koko näyttö')+'</span>'; }
  bt.addEventListener('click', function(){
    try{
      if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else {
        var p = (de.requestFullscreen||de.webkitRequestFullscreen).call(de);
        if(p && p.catch) p.catch(function(){});
      }
    }catch(e){}
  });
  document.addEventListener('fullscreenchange', upd);
  document.addEventListener('webkitfullscreenchange', upd);
  upd(); bar.hidden = false;
})();
</script>
